    case 'arrow-right': return <svg {...props}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    case 'arrow-down':  return <svg {...props}><path d="M12 5v14M6 13l6 6 6-6"/></svg>;
    case 'arrow-up-right': return <svg {...props}><path d="M7 17L17 7M8 7h9v9"/></svg>;
    case 'plus':        return <svg {...props}><path d="M12 5v14M5 12h14"/></svg>;
    case 'download':    return <svg {...props}><path d="M12 4v12M6 12l6 6 6-6M4 20h16"/></svg>;
    case 'pin':         return <svg {...props}><path d="M12 22s7-7.58 7-13a7 7 0 1 0-14 0c0 5.42 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>;
    case 'football':    return <svg {...props}><circle cx="12" cy="12" r="9"/><path d="M12 3l3 4-1 5-4 1-3-4 2-5z"/></svg>;

    case 'coffee':      return <svg {...props}><path d="M4 9h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9z"/><path d="M16 11h2a2 2 0 1 1 0 4h-2"/><path d="M7 3v2M11 3v2"/></svg>;
    case 'sparkle':     return <svg {...props}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>;
    case 'image':       return <svg {...props}><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-7 7"/></svg>;
    case 'pen':         return <svg {...props}><path d="M14 3l7 7-11 11H3v-7L14 3z"/><path d="M14 3l7 7"/></svg>;
    case 'grid':        return <svg {...props}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
    case 'briefcase':   return <svg {...props}><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case 'rocket':      return <svg {...props}><path d="M5 19l-1 1M9 15l-4 4M15 4l5 5-8 8-5-5 8-8z"/><circle cx="14.5" cy="9.5" r="1.5"/></svg>;
    case 'feather':     return <svg {...props}><path d="M20 4c-6 0-12 6-12 14 0 0 8 0 12-4 4-4 4-10 0-10z"/><path d="M8 18l-4 4M16 8L8 16"/></svg>;
    case 'twitter':     return <svg {...props}><path d="M22 5.8a8 8 0 0 1-2.4.7 4 4 0 0 0 1.8-2.2 8 8 0 0 1-2.6 1 4 4 0 0 0-6.8 3.6 11 11 0 0 1-8-4 4 4 0 0 0 1.2 5.3A4 4 0 0 1 3 9.7v.1a4 4 0 0 0 3.2 4 4 4 0 0 1-1.8.1 4 4 0 0 0 3.7 2.8A8 8 0 0 1 2 18.5a11 11 0 0 0 6 1.7c7 0 11-5.9 11-11v-.5A8 8 0 0 0 22 5.8z"/></svg>;

/* ===== SHARED COMPONENTS ===== */
const Reveal = ({ as: Tag = 'div', delay, className = '', children, ...rest }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach(e => { if (e.isIntersecting) { el.classList.add('is-in'); io.unobserve(el); } }),
      { threshold: 0.2 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={`reveal ${className}`} data-delay={delay} {...rest}>{children}</Tag>;
};

const LineMask = ({ children, delay, className = '' }) => (
  <span className={`line-mask ${className}`} data-delay={delay}><span>{children}</span></span>
);

/* ===== DESCRIPTION ===== */
const DescSection = () => {
  const ref = React.useRef(null);
  const words = "I'm a UX and Product Designer based in Ahmedabad. I love making pixels behave and occasionally convince stakeholders that 'make it pop' isn't a design brief.".split(' ');
  React.useEffect(() => {
    const section = ref.current;
    if (!section) return;
    const spans = Array.from(section.querySelectorAll('.desc-word'));
    const onScroll = () => {
      const rect = section.getBoundingClientRect();
      const progress = Math.max(0, Math.min(1, (window.innerHeight - rect.top) / window.innerHeight));
      spans.forEach((span, i) => {
        const wp = Math.max(0, Math.min(1, (progress - i / spans.length) * spans.length));
        const r = Math.round(0x3A + (0xF5 - 0x3A) * wp);
        const g = Math.round(0x37 + (0xF2 - 0x37) * wp);
        const b = Math.round(0x30 + (0xEE - 0x30) * wp);
        span.style.color = `rgb(${r},${g},${b})`;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <section className="desc-section" ref={ref}>
      <p className="desc-text">
        {words.map((word, i) => (
          <React.Fragment key={i}>
            <span className="desc-word">{word}</span>
            {i < words.length - 1 ? ' ' : ''}
          </React.Fragment>
        ))}
      </p>
    </section>
  );
};

const ProjectBlock = ({ project, isLast }) => {
  const blockRef = React.useRef(null);
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    const el = blockRef.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVisible(true); io.disconnect(); } },
      { threshold: 0.1 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <div className={`sw-block${visible ? ' sw-block--in' : ''}`} ref={blockRef}>
      <div className="sw-thumb-wrap">
        <div className="sw-thumb">
          <div className="sw-thumb-label">[ {project.imageLabel} ]</div>

        </div>
        <div className="sw-details-right">
          <div className="sw-pills">
            {project.pills.map((pill, i) => <span className="sw-pill" key={i}>{pill}</span>)}
          </div>
          <a href={project.cta} className="text-link sw-cta">Checkout case study <span className="arrow"><Icon name="arrow-right" size={14}/></span></a>
        </div>
      </div>
      {!isLast && <div className="sw-separator"></div>}
    </div>
  );
};

const SelectedWork = () => {
  const headPinRef = React.useRef(null);
  const headingRef = React.useRef(null);
  const cardsRef = React.useRef(null);

  React.useEffect(() => {
    const onScroll = () => {
      const pin = headPinRef.current;
      const heading = headingRef.current;
      const cards = cardsRef.current;
      if (!pin || !heading || !cards) return;
      const pinRect = pin.getBoundingClientRect();
      const cardsRect = cards.getBoundingClientRect();
      const overlap = pinRect.bottom - cardsRect.top;
      const fadeStart = pinRect.height * 0.15;
      const fadeEnd = pinRect.height * 0.6;
      const progress = Math.max(0, Math.min(1, (overlap - fadeStart) / (fadeEnd - fadeStart)));
      heading.style.opacity = 1 - progress;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <section className="sw-section" id="work">
      <div className="sw-head-pin" ref={headPinRef}>
        <div className="sw-heading" ref={headingRef}>
          <span className="sw-eyebrow">02 — Selected Work</span>
          <h2 className="sw-title">
            Projects that<br/><em>shipped.</em>
          </h2>
          <div className="sw-year-stamp">2K25</div>
        </div>
      </div>
      <div className="sw-cards" ref={cardsRef}>
        <div className="container">
          {projects.map((p, i) => (
            <ProjectBlock key={p.title} project={p} isLast={i === projects.length - 1} />
          ))}
          <div className="sw-more-soon">
            <span>More coming soon</span>
          </div>
        </div>
      </div>
    </section>
  );
};

          setTimeout(() => setFloatReady(true), 1600);

    return () => io.disconnect();

    { name: 'Claude',     logo: './icons/claude.png',     pos: { top: '15%', right: '29%' },    floatAnim: 'float2 3.8s ease-in-out 0.3s infinite',  initTransform: 'translate(-14vw, 18vh) scale(0.6)',  entryDelay: '0.08s' },

    { name: 'Relume',     logo: './icons/relume.png',     pos: { bottom: '14%', left: '37%' },  floatAnim: 'float6 4.8s ease-in-out 1.5s infinite',  initTransform: 'translate(7vw, -18vh) scale(0.6)',   entryDelay: '0.4s' },

  ];

      <div className="container">

/* ===== CURSOR ===== */
const Cursor = () => {
  React.useEffect(() => {
    const dot = document.createElement('div');
    const ring = document.createElement('div');
    dot.className = 'cursor-dot';
    ring.className = 'cursor-ring';
    document.body.appendChild(dot);
    document.body.appendChild(ring);
    let rx = window.innerWidth / 2, ry = window.innerHeight / 2, dx = rx, dy = ry, raf;
    const move = (e) => { dx = e.clientX; dy = e.clientY; dot.style.left = dx + 'px'; dot.style.top = dy + 'px'; };
    const loop = () => { rx += (dx - rx) * 0.18; ry += (dy - ry) * 0.18; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; raf = requestAnimationFrame(loop); };
    loop();
    const sel = 'a, button, .work-card, .ai-card, .test-card, .engage-card, .personality-pill, .trait-card, .faq-q, .social-box';
    const over = (e) => { if (e.target.closest(sel)) { dot.classList.add('is-hover'); ring.classList.add('is-hover'); } };
    const out  = (e) => { if (e.target.closest(sel)) { dot.classList.remove('is-hover'); ring.classList.remove('is-hover'); } };
    window.addEventListener('mousemove', move);
    document.addEventListener('mouseover', over);
    document.addEventListener('mouseout', out);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', move); document.removeEventListener('mouseover', over); document.removeEventListener('mouseout', out); dot.remove(); ring.remove(); };
  }, []);
  return null;
};
